name: Export Web and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    name: Export Web build
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv -v /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable || true

      - name: Export Web preset
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --path . --export-release "Web" "$(pwd)/build/web/index.html"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy:
    name: Deploy to Pages
    needs: export
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # A rerun keeps the artifacts from the previous attempt. Giving each
      # attempt its own name stops deploy-pages from finding two of them.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web

      # The artifact list is briefly stale after an upload. Poll until the
      # metadata is visible before asking deploy-pages to look for it.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 20); do
            ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id")
            if [ -n "$ids" ]; then
              echo "Artifact is visible: $ids"
              exit 0
            fi
            echo "Waiting for artifact metadata ($i/20)..."
            sleep 3
          done
          echo "Pages artifact never appeared" >&2
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
